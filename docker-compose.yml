services:
  app:
    build: .
    container_name: ela-api
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      APP_PORT: 8080
      APP_LOG_LEVEL: info
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: ela
      DATABASE_SSL_MODE: disable
      DATABASE_TIMEZONE: UTC
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: ela-postgres
    environment:
      POSTGRES_DB: ela
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ela"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
