openapi: "3.0.3"
info:
  title: ELA-BE — Employee List Application API
  description: >
    REST API for the Employee List Application backend scaffold.
    Built with Go, Gin, Go Kit, GORM, and PostgreSQL.
  version: "1.0.0"
  contact: {}

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: health
    description: Service health
  - name: employees
    description: Employee management

paths:
  /health:
    get:
      tags:
        - health
      summary: Health check
      description: Returns the health status of the running service.
      operationId: healthCheck
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/v1/employees:
    post:
      tags:
        - employees
      summary: Create an employee
      description: Creates a new employee record. `name` and `email` are required.
      operationId: createEmployee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
            example:
              name: Jane Doe
              email: jane@example.com
              position: Software Engineer
      responses:
        "201":
          description: Employee created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
              example:
                id: 1
                name: Jane Doe
                email: jane@example.com
                position: Software Engineer
                created_at: "2024-01-15T10:30:00Z"
                updated_at: "2024-01-15T10:30:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

    get:
      tags:
        - employees
      summary: List all employees
      description: Returns a list of all employees ordered by `id` ascending.
      operationId: listEmployees
      responses:
        "200":
          description: Array of employees (empty array when none exist)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
              example:
                - id: 1
                  name: Jane Doe
                  email: jane@example.com
                  position: Software Engineer
                  created_at: "2024-01-15T10:30:00Z"
                  updated_at: "2024-01-15T10:30:00Z"
                - id: 2
                  name: John Smith
                  email: john@example.com
                  position: Product Manager
                  created_at: "2024-01-16T09:00:00Z"
                  updated_at: "2024-01-16T09:00:00Z"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/employees/{id}:
    parameters:
      - $ref: "#/components/parameters/EmployeeID"

    get:
      tags:
        - employees
      summary: Get an employee by ID
      description: Returns a single employee by their numeric ID.
      operationId: getEmployeeByID
      responses:
        "200":
          description: Employee found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
              example:
                id: 1
                name: Jane Doe
                email: jane@example.com
                position: Software Engineer
                created_at: "2024-01-15T10:30:00Z"
                updated_at: "2024-01-15T10:30:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      tags:
        - employees
      summary: Update an employee
      description: >
        Updates an existing employee. Only non-blank fields in the request body
        are applied — omitted or blank fields leave the record unchanged
        (partial update).
      operationId: updateEmployee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdateInput"
            example:
              position: Senior Software Engineer
      responses:
        "200":
          description: Employee updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
              example:
                id: 1
                name: Jane Doe
                email: jane@example.com
                position: Senior Software Engineer
                created_at: "2024-01-15T10:30:00Z"
                updated_at: "2024-01-20T14:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags:
        - employees
      summary: Delete an employee
      description: Permanently deletes an employee record.
      operationId: deleteEmployee
      responses:
        "204":
          description: Employee deleted (empty body)
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  schemas:
    Employee:
      type: object
      description: Canonical employee representation returned by the API.
      properties:
        id:
          type: integer
          format: uint
          description: Auto-generated primary key.
          example: 1
        name:
          type: string
          maxLength: 255
          description: Full name of the employee.
          example: Jane Doe
        email:
          type: string
          format: email
          maxLength: 255
          description: Unique email address.
          example: jane@example.com
        position:
          type: string
          maxLength: 255
          description: Job title / position. May be an empty string.
          example: Software Engineer
        created_at:
          type: string
          format: date-time
          description: RFC 3339 timestamp of record creation (UTC).
          example: "2024-01-15T10:30:00Z"
        updated_at:
          type: string
          format: date-time
          description: RFC 3339 timestamp of last update (UTC).
          example: "2024-01-15T10:30:00Z"

    EmployeeInput:
      type: object
      description: Payload for creating an employee.
      required:
        - name
        - email
      properties:
        name:
          type: string
          maxLength: 255
          description: Full name — required, must be non-blank.
          example: Jane Doe
        email:
          type: string
          format: email
          maxLength: 255
          description: Email address — required, must be unique.
          example: jane@example.com
        position:
          type: string
          maxLength: 255
          description: Job title / position — optional.
          example: Software Engineer

    EmployeeUpdateInput:
      type: object
      description: >
        Payload for updating an employee. All fields are optional.
        Only non-blank values are applied to the record.
      properties:
        name:
          type: string
          maxLength: 255
          description: New full name.
          example: Jane Doe
        email:
          type: string
          format: email
          maxLength: 255
          description: New email address — must be unique if provided.
          example: jane@example.com
        position:
          type: string
          maxLength: 255
          description: New job title / position.
          example: Senior Software Engineer

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error description.
          example: employee not found

  parameters:
    EmployeeID:
      name: id
      in: path
      required: true
      description: Numeric employee ID (unsigned integer > 0).
      schema:
        type: integer
        format: uint
        minimum: 1
      example: 1

  responses:
    BadRequest:
      description: Bad request — validation or parse error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: name is required

    NotFound:
      description: Employee not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: employee not found

    InternalServerError:
      description: Unexpected internal server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: internal server error
